# screen color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# enable undercurl & underline colors
set -as terminal-features ",*:usstyle"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# enable mouse
set -g mouse on
unbind -T copy-mode-vi MouseDragEnd1Pane

# scrollback buffer size
set-option -g history-limit 50000

# status bar
set-option -g status-right " \"#{=22:pane_title}\" %l:%M %d-%b-%y"
set-window-option -g window-status-current-style 'fg=black,bg=#aaaaaa'
set-option -g status-position top

# use <C-h/j/k/l> to move between tmux panes
set -g @plugin 'mrjones2014/smart-splits.nvim'
bind-key -n C-h if -F '#{@pane-is-vim}' { send-keys C-h } { if -F '#{pane_at_left}'   '' 'select-pane -L' }
bind-key -n C-j if -F '#{@pane-is-vim}' { send-keys C-j } { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n C-k if -F '#{@pane-is-vim}' { send-keys C-k } { if -F '#{pane_at_top}'    '' 'select-pane -U' }
bind-key -n C-l if -F '#{@pane-is-vim}' { send-keys C-l } { if -F '#{pane_at_right}'  '' 'select-pane -R' }
#bind-key -T copy-mode-vi 'C-h' select-pane -L
#bind-key -T copy-mode-vi 'C-j' select-pane -D
#bind-key -T copy-mode-vi 'C-k' select-pane -U
#bind-key -T copy-mode-vi 'C-l' select-pane -R

# don't delay after pressing <ESC> in vim
set-option -sg escape-time 0
# somehow make vim work better maybe?
set-option -g focus-events on

# use vim motion keys in copy mode
set-window-option -g mode-keys vi
# in tmux copy mode, start selecting text with v and copy it with y
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# specify tpm plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# save and restore sessions across tmux server restarts. The WSL VM is powered
# off whenever the WSL service stops, so the tmux server does not survive a WSL
# update or a host restart. The continuum plugin snapshots the sessions
# periodically and restores them on server start.
# To install on a new machine:
#     git clone --depth 1 https://github.com/tmux-plugins/tmux-resurrect ~/.tmux/plugins/tmux-resurrect
#     git clone --depth 1 https://github.com/tmux-plugins/tmux-continuum ~/.tmux/plugins/tmux-continuum
set -g @plugin 'tmux-plugins/tmux-resurrect'
# restore what each pane was showing, not just the layout
set -g @resurrect-capture-pane-contents 'on'
# restore vim/neovim sessions when a Session.vim is present
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
# restore claude code panes with their conversation instead of a bare shell.
# The tilde loose-matches whatever flags claude was started with; the arrow
# substitutes the restore command. --continue resumes the newest conversation
# for the pane's restored cwd, so two claude panes in one directory share one
# history
set -g @resurrect-processes '"~claude->claude --continue"'
# continuum must stay last in the plugin list
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# load tpm plugins. Use
#     git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# to install tpm on a new machine
run '~/.tmux/plugins/tpm/tpm'

# allow shift+enter to work
bind -n S-Enter send-keys Escape "[13;2u"

# allow gemini-notifier to work
set -g allow-passthrough on

# keep current path when splitting panes
bind-key '%' split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key 'c' new-window -a -c "#{pane_current_path}"

# make inactive panes lighter
set-window-option -g window-style 'bg=#222222'
set-window-option -g window-active-style 'bg=#000000'
set-option -g pane-border-style 'fg=#FFFFFF,bg=#222222'
set-option -g pane-active-border-style 'fg=#00FF00,bg=#000000'

# file path picker extension
# install fzf:
#   git clone --depth 1 https://github.com/junegunn/fzf.git ~/.fzf && ~/.fzf/install
# install fd
#   sudo apt-get update && sudo apt-get install fd-find
# install extension
#   curl -O https://raw.githubusercontent.com/raine/tmux-file-picker/main/tmux-file-picker && chmod +x tmux-file-picker && mv tmux-file-picker ~/.local/bin
bind C-f display-popup -E "tmux-file-picker"
